name: Daily Download and Commit (Archived)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      DATA_REPOSITORY: ${{ secrets.DATA_REPOSITORY }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      ORIGINAL_FILENAME: ${{ vars.ORIGINAL_FILENAME || secrets.ORIGINAL_FILENAME || 'vaultwarden' }}
      BARK_URL: ${{ secrets.BARK_URL }}

    steps:
      - name: ⬇️ Checkout Scripts Repository
        uses: actions/checkout@v5

      - name: ⚙️ Pre-check Configuration
        run: |
          set -euo pipefail
          echo "Checking environment variables..."
          if [ -z "${DOWNLOAD_URL:-}" ]; then
            echo "错误: 未配置 secrets.DOWNLOAD_URL" >&2
            exit 1
          fi
          if [ -z "${DATA_REPOSITORY:-}" ]; then
            echo "错误: 未配置 secrets.DATA_REPOSITORY (当前获取为空)" >&2
            exit 1
          fi
          if [ -z "${PAT_TOKEN:-}" ]; then
            echo "错误: 未配置 secrets.PAT_TOKEN (当前获取为空)" >&2
            exit 1
          fi
          echo "配置检查通过。"

      - name: ⚙️ Set up Dynamic Paths and Filename
        id: setup
        run: |
          set -euo pipefail

          if [ -z "${DOWNLOAD_URL:-}" ]; then
            echo "DOWNLOAD_URL is empty. Exiting."
            exit 1
          fi

          YEAR=$(TZ='Asia/Shanghai' date +'%Y')
          MONTH=$(TZ='Asia/Shanghai' date +'%m')
          CURRENT_DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d')

          FULL_OUTPUT_DIR="${YEAR}/${MONTH}"
          NEW_FILENAME="${ORIGINAL_FILENAME}_${CURRENT_DATE}.zip"
          TARGET_PATH="${FULL_OUTPUT_DIR}/${NEW_FILENAME}"

          echo "FULL_OUTPUT_DIR=$FULL_OUTPUT_DIR" >> $GITHUB_ENV
          echo "NEW_FILENAME=$NEW_FILENAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$TARGET_PATH" >> $GITHUB_ENV

          echo "Will save to: $TARGET_PATH"

      - name: ⬇️ Checkout Data Repository (Sparse Checkout)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DATA_REPOSITORY }}
          token: ${{ env.PAT_TOKEN }}
          path: 'data'
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            ${{ env.FULL_OUTPUT_DIR }}

      - name: 📂 Create Download Directory (YYYY/MM)
        run: |
          set -euo pipefail
          mkdir -p "data/${{ env.FULL_OUTPUT_DIR }}"

      - name: 📥 Download File (ZIP format) with retry and validation
        run: python scripts/download_backup.py

      - name: 💾 Commit and Push Changes (only if changed)
        run: |
          set -euo pipefail

          if [ "${{ env.SKIP_COMMIT || 'false' }}" = "true" ]; then
            echo "No changes to commit. Skipping."
            exit 0
          fi

          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE_PATH="${{ env.TARGET_PATH }}"

          FILE_SIZE_BYTES=$(wc -c < "$FILE_PATH")
          if [ "$FILE_SIZE_BYTES" -ge 1048576 ]; then
            FILE_SIZE=$(echo "$FILE_SIZE_BYTES" | awk '{printf "%.2f MB", $1/1048576}')
          else
            FILE_SIZE=$(echo "$FILE_SIZE_BYTES" | awk '{printf "%.2f KB", $1/1024}')
          fi
          SHA256_SUM=$(sha256sum "$FILE_PATH" | awk '{print $1}')

          git add "$FILE_PATH" || true

          if ! git diff-index --quiet HEAD --; then
            git commit -m "feat(daily): Add or update $FILE_PATH" \
                       -m "- File Size: $FILE_SIZE" \
                       -m "- SHA256: $SHA256_SUM"
            git push
            echo "Changes pushed."
          else
            echo "No changes to commit."
          fi

      - name: 📝 Update README Daily Status
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          repo_status = os.environ.get('WORKFLOW_STATUS', 'success')
          status_map = {
              'success': '✅ 成功',
              'failure': '❌ 失败',
              'cancelled': '⏹️ 已取消',
          }
          status_text = status_map.get(repo_status, '⚠️ 未知')

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)
          date_str = now.strftime('%Y-%m-%d')
          time_str = now.strftime('%H:%M:%S')

          block = (
              "## 📊 今日执行状态\n\n"
              f"- 日期：{date_str}\n"
              f"- 状态：{status_text}\n"
              f"- 最后更新：{date_str} {time_str} (北京时间)\n"
              "- 说明：此状态由 GitHub Actions 自动更新，每次执行后刷新当天状态。\n"
          )

          readme = Path('README.md')
          if not readme.exists():
              readme.write_text(block + '\n', encoding='utf-8')
              raise SystemExit(0)

          content = readme.read_text(encoding='utf-8')
          marker = '## 📊 今日执行状态'

          if marker in content:
              start = content.index(marker)
              end = content.find('\n\n本项目使用', start)
              if end == -1:
                  end = content.find('\n---\n\n## ⚠️', start)
              if end == -1:
                  end = len(content)
              content = content[:start] + block + '\n' + content[end:]
          else:
              badge_marker = '\n[![Daily Backup Status]'
              if badge_marker in content:
                  content = content.replace(badge_marker, badge_marker + '\n\n' + block + '\n', 1)
              else:
                  content = block + '\n' + content

          readme.write_text(content, encoding='utf-8')
          PY

      - name: 📤 Commit README status update
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README status unchanged."
            exit 0
          fi
          git commit -m "docs: update daily execution status"
          git push

      - name: 🔔 Notify on Failure (Bark)
        if: ${{ failure() && env.BARK_URL != '' }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Vaultwarden 备份失败"
          BODY="仓库 ${{ github.repository }} 的每日备份任务失败，请检查下载链接或 Token。查看日志: $RUN_URL"
          BASE="${BARK_URL%/}"
          curl -fsS -X POST "$BASE" \
            --data-urlencode "title=$TITLE" \
            --data-urlencode "body=$BODY" \
            --data-urlencode "group=vaultwarden_backup" \
            --data-urlencode "level=timeSensitive" \
            || echo "Bark 通知发送失败（不影响主流程结果）。"
